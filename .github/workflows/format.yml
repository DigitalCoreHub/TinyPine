name: Format Check

on:
    push:
        branches: [main, develop, v1.3.0-core-upgrade]
    pull_request:
        branches: [main, develop]

jobs:
    format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check formatting with Prettier
              run: npx prettier --check "**/*.{js,json,md,yml}"

            - name: Format code (if check fails)
              if: failure()
              run: |
                  echo "❌ Code formatting check failed"
                  echo "💡 Run 'npm run format' locally to fix formatting issues"
                  npx prettier --write "**/*.{js,json,md,yml}"
                  git diff --stat
