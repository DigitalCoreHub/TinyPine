name: Dependabot

on:
  schedule:
    - cron: '0 0 * * 0' # Her Pazar gecesi

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Check for updates
      run: npm outdated || echo "All dependencies up to date"

